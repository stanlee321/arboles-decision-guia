[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arboles-decision-guia"
version = "0.1.0"
description = "Material docente reproducible sobre arboles de decision"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.2,<2",
  "matplotlib>=3.6,<4",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4,<5",
  "nbconvert>=7,<8",
  "pytest>=7,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
